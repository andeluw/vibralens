[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibralens"
version = "0.1.0"
description = "Leakage-safe bearing prognostics and maintenance decision support."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
vibralens-build-manifest = "vibralens.data.xjtu_sy:main"

[tool.setuptools.packages.find]
where = ["src"]
