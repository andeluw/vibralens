[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibralens"
version = "0.1.0"
description = "Leakage-safe bearing prognostics and maintenance decision support."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<1.7",
]

[project.scripts]
vibralens-build-manifest = "vibralens.data.xjtu_sy:main"
vibralens-extract-features = "vibralens.features.vibration:main"
vibralens-train-rul = "vibralens.modeling.training:main"

[tool.setuptools.packages.find]
where = ["src"]
